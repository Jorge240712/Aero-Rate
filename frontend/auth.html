<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AeroRate | Acceso</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="auth">
    <div class="page-shell auth-shell">
      <div class="auth-card glass-card">
        <div class="auth-panel">
          <p class="eyebrow">Bienvenido</p>
          <h1>Entrá a AeroRate</h1>
          <form id="login-form" class="stack-form">
            <div class="field-group">
              <label for="login-email">Email</label>
              <input id="login-email" type="email" placeholder="tu@email.com" required />
            </div>
            <div class="field-group">
              <label for="login-password">Contraseña</label>
              <input id="login-password" type="password" placeholder="••••••••" required />
            </div>
            <button class="primary-btn full-width" type="submit">Iniciar sesión</button>
          </form>
        </div>

        <div class="auth-panel alt-panel">
          <p class="eyebrow">Crear cuenta</p>
          <h2>Empezá hoy</h2>
          <form id="register-form" class="stack-form">
            <div class="field-group">
              <label for="reg-username">Usuario</label>
              <input id="reg-username" type="text" placeholder="Tu nombre" required />
            </div>
            <div class="field-group">
              <label for="reg-email">Email</label>
              <input id="reg-email" type="email" placeholder="tu@email.com" required />
            </div>
            <div class="field-group">
              <label for="reg-password">Contraseña</label>
              <input id="reg-password" type="password" placeholder="mínimo 6 caracteres" required />
            </div>
            <button class="secondary-btn full-width" type="submit">Registrarme</button>
          </form>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
  </body>
</html>
