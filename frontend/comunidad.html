<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AeroRate | Comunidad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="comunidad">
    <div class="page-noise"></div>
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>
    <div class="grid-glow"></div>

    <header class="topbar">
      <a href="index.html" class="brand-wrap">
        <div class="brand-mark">A</div>
        <span>AeroRate</span>
      </a>

      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="destinos.html">Destinos</a>
        <a href="vuelos.html">Vuelos</a>
        <a href="comunidad.html">Comunidad</a>
        <a href="perfil.html">Perfil</a>
      </nav>

      <a class="ghost-btn" href="perfil.html">Mi viaje</a>
    </header>

    <main class="page-shell page-top">
      <section class="page-section reveal">
        <p class="eyebrow">Comunidad</p>
        <h1>Historias que te ayudan a decidir.</h1>
      </section>

      <section class="page-section reveal">
        <div class="story-grid" data-stories></div>
      </section>

      <section class="page-section reveal">
        <div class="review-layout">
          <div class="review-panel glass-card">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Dejar reseña</p>
                <h3>Contá tu experiencia</h3>
              </div>
              <span class="pulse-badge">Live</span>
            </div>

            <form id="review-form">
              <div class="field-group">
                <label for="review-rating">Calificación</label>
                <select id="review-rating" required>
                  <option value="">Selecciona una puntuación...</option>
                  <option value="5">⭐⭐⭐⭐⭐ Experiencia increíble</option>
                  <option value="4">⭐⭐⭐⭐ Muy buena</option>
                  <option value="3">⭐⭐⭐ Aceptable</option>
                  <option value="2">⭐⭐ Regular</option>
                  <option value="1">⭐ No me gustó</option>
                </select>
              </div>

              <div class="field-group">
                <label for="review-comment">Tu comentario</label>
                <textarea id="review-comment" placeholder="¿Qué te sorprendió del destino? ¿Valió la pena?" required></textarea>
              </div>

              <button type="submit" class="primary-btn full-width">Publicar reseña</button>
            </form>
          </div>

          <aside class="community-panel glass-card">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Últimas</p>
                <h3>Voces de la comunidad</h3>
              </div>
            </div>
            <div class="review-list" id="reviews-list"></div>
          </aside>
        </div>
      </section>
    </main>

    <footer class="site-footer reveal">
      <p>© <span id="year"></span> AeroRate — Viaja mejor.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
